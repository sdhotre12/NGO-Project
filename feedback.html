<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Are Women Safe in India?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Video background */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.8;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 20px;
      flex-direction: column;
      text-align: center;
    }

    .card {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h2 {
      font-size: 24px;
      color: #00bcd4;
      margin-bottom: 10px;
    }

    .quote {
      font-style: italic;
      font-size: 14px;
      margin-bottom: 20px;
      color: #ddd;
    }

    .emojis {
      display: flex;
      justify-content: space-around;
      font-size: 2.5rem;
      margin: 20px 0;
    }

    .emoji {
      cursor: pointer;
      transition: transform 0.3s, filter 0.3s;
    }

    .emoji:hover {
      transform: scale(1.3);
      filter: brightness(110%);
    }

    .emoji-caption {
      font-size: 13px;
      margin-top: 5px;
      color: #ccc;
    }

    #feedbackBox {
      display: none;
      margin-top: 20px;
    }

    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #555;
      resize: none;
      font-family: inherit;
      font-size: 14px;
      background-color: #111;
      color: #eee;
      margin-bottom: 10px;
    }

    button {
      background-color: #00bcd4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0097a7;
    }

    .thank-you {
      display: none;
      color: lightgreen;
      margin-top: 15px;
      font-weight: bold;
    }

    .anonymous-note {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #ccc;
      font-size: 13px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 480px) {
      .emojis {
        flex-direction: column;
        gap: 10px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 🔴 Replace this video URL with your own or royalty-free girls safety video -->
  <video autoplay muted loop class="video-background">
    <source src="feedback.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div class="container">
    <div class="card">
      <h2>Are Women Safe in India?</h2>
      <div class="quote">“Every 16 minutes, a woman is raped in India.”</div>

      <div class="emojis">
        <div class="emoji" onclick="handleVote('Yes')">🟢
          <div class="emoji-caption">Yes, I feel safe</div>
        </div>
        <div class="emoji" onclick="handleVote('Sometimes')">🟡
          <div class="emoji-caption">Sometimes</div>
        </div>
        <div class="emoji" onclick="handleVote('No')">🔴
          <div class="emoji-caption">No, I don’t feel safe</div>
        </div>
      </div>

      <div id="feedbackBox">
        <p>Would you like to share why?</p>
        <textarea id="userFeedback" rows="4" placeholder="Your story or suggestion (optional)..."></textarea>
        <br>
        <button onclick="submitFeedback()">Submit</button>
      </div>

      <div class="anonymous-note">🔒 Your feedback is anonymous</div>
      <div id="thankYou" class="thank-you">Thank you for sharing 💖</div>
    </div>
  </div>

  <footer>
    2025 Women's Safety Project | Designed with ❤️ by Team SecureHer
  </footer>

  <script>
    function handleVote(vote) {
      console.log("Vote:", vote);
      document.getElementById("feedbackBox").style.display = "block";
      document.getElementById("thankYou").style.display = "none";
    }

    function submitFeedback() {
      const feedback = document.getElementById("userFeedback").value.trim();
      console.log("User Feedback:", feedback);
      document.getElementById("feedbackBox").style.display = "none";
      document.getElementById("thankYou").style.display = "block";
    }
  </script>

</body>
</html>
