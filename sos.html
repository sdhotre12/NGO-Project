<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS Emergency</title>
  <style>

      display: flex;

      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #202bfd, #ffd2db);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      /* overflow: hidden; */
    }

    .typing-heading {
    font-size: 36px;
    font-weight: bold;
    text-align: center;
    color: #fff;
    border-right: 6px solid #fff;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    margin-bottom: 25px;
    animation: typing 4s steps(20, end) forwards, blink 0.7s infinite;
  }

  @keyframes typing {
    from { width: 0; }
    to { width: 22ch; } /* Adjust based on text length */
  }

  @keyframes blink {
    50% { border-color: transparent; }
  }
    .container {
      margin-top: 100px;
      text-align: center;
      z-index: 10;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 25px;
      animation: fadeInDown 1.5s ease;
    }

    /* SOS Button */
    .sos-btn {
      background: radial-gradient(circle, #ff1a1a, #b30000);
      border: none;
      border-radius: 50%;
      width: 200px;
      height: 200px;
      font-size: 42px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      position: relative;
      z-index: 2;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.416);
      animation: heartbeat 1.5s infinite, pulseGlow 2s infinite;
    }

    .sos-btn::after {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      top: 0;
      left: 0;
      background: rgba(255,0,0,0.3);
      animation: ripple 2s infinite;
      z-index: -1;
    }

    .sos-btn:hover {
      transform: scale(1.08);
    }

    /* Safety Tip Box
    .tip-box {
      margin-top: 40px;
      padding: 18px 25px;
      background: #2c36bf;
      border-radius: 15px;
      font-size: 18px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      backdrop-filter: blur(8px);
      animation: fadeInUp 1.5s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    } */
     .tip-box {
    margin-top: 40px;
    padding: 20px 25px;
    background: linear-gradient(130deg, #270150, #3d84ff);
    color: #fff;
    border-radius: 15px;
    font-size: 18px;
    font-weight: 500;
    text-align: center;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
    animation: glowPulse 3s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 15px #2c36bf, 0 0 30px #3a47d5; }
    50% { box-shadow: 0 0 30px #3a47d5, 0 0 60px #1e2aff; }
  }

  /* Fade + slide animation when changing tips */
  .fade-slide {
    animation: fadeSlide 1s ease;
  }

  @keyframes fadeSlide {
    0% {
      opacity: 0;
      transform: translateY(10px);
    }
    50% {
      opacity: 0.5;
      transform: translateY(-5px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Typewriter animation (optional for each tip text) */
  .typewriter {
    overflow: hidden;
    white-space: nowrap;
    border-right: 3px solid rgba(255, 255, 255, 0.8);
    animation: typing 2s steps(40, end), blink 0.7s step-end infinite;
  }

  @keyframes typing {
    from { width: 0 }
    to { width: 100% }
  }

  @keyframes blink {
    from, to { border-color: transparent }
    50% { border-color: rgba(255, 255, 255, 0.8) }
  }

    /* Message */
    .message {
      margin-top: 20px;
      font-size: 22px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      font-weight: bold;
      color: #ffd700;
    }

    /* Animations */
    @keyframes heartbeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(1); }
      75% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(255,0,0,0.5); }
      50% { box-shadow: 0 0 60px rgba(255,0,0,1); }
      100% { box-shadow: 0 0 20px rgba(255,0,0,0.5); }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flashBg {
      0% { background: linear-gradient(135deg, #2c36bf, #ff4d6d); }
      50% { background: linear-gradient(135deg, #ff0000, #660000); }
      100% { background: linear-gradient(135deg, #2e2cbf, #ff4d6d); }
    }

    .flash {
      animation: flashBg 0.6s infinite;
    }

    /* Floating circles background */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: floatUp 10s infinite linear;
      bottom: -100px;
    }
    @keyframes floatUp {
      from { transform: translateY(0); opacity: 0.7; }
      to { transform: translateY(-120vh); opacity: 0; }
    }
    footer {
      color: white;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <!-- <h1 class="glow-heading">🚨 Emergency SOS 🚨</h1> -->
   <h1 class="typing-heading"></h1>

  <div class="container">
    <h1>Press the SOS Button in Case of Emergency</h1>
    <button class="sos-btn" onclick="triggerSOS()">SOS</button>
    <p class="message" id="msg">Connecting to Women Helpline (1091)...</p>

    <div class="tip-box" id="tipBox">
      💡 Safety Tip: Always share your live location with a trusted friend.
    </div>
  </div>

  <!-- Floating background circles -->
  <div class="circle" style="width:80px; height:80px; left:20%; animation-duration:12s;"></div>
  <div class="circle" style="width:50px; height:50px; left:70%; animation-duration:15s;"></div>
  <div class="circle" style="width:100px; height:100px; left:40%; animation-duration:18s;"></div>
  <footer><p> &copy; 2025 Women's Safety Project | Designed with ❤️ by Team SecureHer</p></footer>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    document.querySelector(".typing-heading").textContent = "🚨 Emergency SOS 🚨";
  });
    function triggerSOS() {
      document.body.classList.add("flash"); 
      let msg = document.getElementById("msg");
      msg.style.opacity = 1;

      // Simulate dialing
      setTimeout(() => {
        alert("Dialing Women Helpline (1091) 📞");
        window.location.href = "tel:1091"; 
      }, 2500);
    }

    // Rotating safety tips
    // const tips = [
    //   "💡 Always share your live location with a trusted friend.",
    //   "💡 Save emergency numbers (100, 1091, 112) on speed dial.",
    //   "💡 Avoid poorly lit and isolated areas when traveling alone.",
    //   "💡 Keep a power bank with you to avoid dead phone situations.",
    //   "💡 Trust your instincts – if something feels wrong, act immediately."
    // ];
    // let tipIndex = 0;
    // setInterval(() => {
    //   tipIndex = (tipIndex + 1) % tips.length;
    //   document.getElementById("tipBox").innerText = tips[tipIndex];
    // }, 5000);
    // 🔄 Rotating Safety Tips
  const tips = [
    "💡 Always share your live location with a trusted friend.",
    "💡 Save emergency numbers (100, 1091, 112) on speed dial.",
    "💡 Avoid poorly lit and isolated areas when traveling alone.",
    "💡 Keep a power bank with you to avoid dead phone situations.",
    "💡 Trust your instincts – if something feels wrong, act immediately."
  ];

  let tipIndex = 0;
  const tipBox = document.getElementById("tipBox");

  setInterval(() => {
    tipIndex = (tipIndex + 1) % tips.length;

    // Remove old animation classes
    tipBox.classList.remove("fade-slide", "typewriter");

    // Trigger reflow to restart animation
    void tipBox.offsetWidth;

    // Change text with fade + typing animation
    tipBox.innerText = tips[tipIndex];
    tipBox.classList.add("fade-slide", "typewriter");

  }, 6000); // Change tip every 6 seconds
  </script>

</body>
</html>
