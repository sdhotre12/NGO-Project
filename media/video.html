<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Gallery | Her Voice, Her Power</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    /* ================= GENERAL STYLES ================= */
    :root {
      --primary: #0033a0;
      --white: #ffffff;
      --accent: #f5a623;
      --light-bg: #f8f9ff;
      --transition-fast: 0.3s ease;
      --transition-slow: 0.6s ease;
      --radius: 14px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.15);
      --shadow-glow: 0 0 18px rgba(0,160,210,0.3);
      --hover-lift: -8px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Poppins',sans-serif;
      background-color: var(--light-bg);
      color: var(--primary);
      overflow-x:hidden;
    }

    /* ================= HEADER ================= */
    header {
      background-image: url("videoBcg.png");
      background-size: cover;
      background-position:center;
      color: black;
      text-align:center;
      padding: 10px 8px;
    }
    header h1 { font-size:2.5rem; letter-spacing:1px; }
    header h1 img { height: 100px; width: 100px; vertical-align: middle; }
    header p { font-size:1.1rem; margin:2rem 0 2rem 0; }

    /* ================= VIDEO GALLERY ================= */
    .video-gallery {
      background: var(--white);
      color: var(--primary);
      max-width: 1200px;
      margin: 2rem auto 3rem;
      padding: 2rem 1rem 3rem;
    }
    .gallery-title {
      font: 700 1.75rem/1.2 'Poppins', sans-serif;
      color: var(--primary);
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: 0.2px;
    }
    .gallery-grid {
      display: grid;
      gap: 1.8rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    /* ================= VIDEO CARD ================= */
    .video-card {
      display: block;
      width: 100%;
      background: #f4f7ff;
      border: 1px solid #dbe5ff;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
      transform-style: preserve-3d;
    }
    .video-card:hover {
      box-shadow: var(--shadow-md), var(--shadow-glow);
      border-color: rgba(0, 160, 210, 0.6);
      transform: translateY(var(--hover-lift)) scale(1.03);
    }

    .video-figure {
      position: relative;
      height: 180px;
      background: linear-gradient(180deg, #eef1f7, #e2e7f5);
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: 1px solid #edf2ff;
      transition: transform var(--transition-fast);
    }
    .video-card:hover .video-figure { transform: scale(1.05); }

    .video-thumb {
      position: absolute;
      inset: 12px;
      width: calc(100% - 24px);
      height: calc(100% - 24px);
      object-fit: cover;
      border: 1px solid #cfd6e6;
      border-radius: 8px;
      background: #e9edf5;
      transition: transform var(--transition-slow), opacity var(--transition-fast);
    }

    /* ================= PLAY BUTTON ================= */
    .play-indicator {
      position: relative;
      z-index: 1;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% , #d2d2d2 0%, #80828664 50%, #000000b9 90%);
      box-shadow: 0 8px 20px rgba(0, 68, 204, 0.38), 0 4px 6px rgba(0,0,0,0.18);
      display: grid;
      place-items: center;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .play-indicator::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 20px solid #fff;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      margin-left: 4px;
    }
    .video-card:hover .play-indicator {
      transform: scale(1.2);
      filter: brightness(1.05);
    }

    /* ================= CAPTION ================= */
    .video-caption {
      background: var(--white);
      padding: 12px 14px 16px;
      color: black;
      font: 700 1rem/1.4 'Poppins', sans-serif;
      border-top: 1px solid #edf2ff;
      text-align: left;
      transition: color var(--transition-fast);
    }
    .video-caption::after {
      content: attr(data-meta);
      display: block;
      font: 400 0.85rem/1.4 'Poppins', sans-serif;
      color: #687386;
      margin-top: 4px;
    }

    /* ================= LIGHTBOX ================= */
    .lightbox[hidden] { display: none; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
    }
    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: saturate(0.9) blur(2px);
    }
    .lightbox-dialog {
      position: relative;
      max-width: 980px;
      margin: 3rem auto;
      padding: 1rem;
      background: var(--white);
      color: var(--primary);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid #dbe5ff;
    }
    @media (max-width: 640px) { .lightbox-dialog { margin: 1rem; } }

    .lightbox-title { margin:0 2.5rem 0.5rem 0; font:700 1.25rem 'Poppins'; color: var(--primary); }
    .lightbox-player { position: relative; border-radius: calc(var(--radius) - 4px); overflow: hidden; background: #000; }
    .lightbox-video { width: 100%; aspect-ratio: 16/9; display:block; }
    .lightbox-caption { margin:0.75rem 0 0.5rem; color: #555; font-size: 0.95rem; line-height: 1.5; }
    .lightbox-close {
      position: absolute;
      top: 0.5rem;
      right: 0.6rem;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      background: var(--white);
      color: var(--primary);
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .lightbox-close:hover { background: var(--accent); color: var(--white); }

    .lightbox-controls {
      display:flex;
      justify-content: space-between;
      gap:0.5rem;
      margin-top:0.5rem;
    }
    .nav-btn {
      flex:1 1 0;
      padding:0.6rem 0.75rem;
      border:1px solid #dbe5ff;
      background: var(--white);
      color: var(--primary);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .nav-btn:hover { background: var(--primary); color: var(--white); box-shadow: var(--shadow-glow); }
    footer{
  background-color: #0033a0;
  color: white;
  text-align:center;
  padding:15px 0;
  font-size:0.9rem;
  margin-top:40px;
}
  </style>
</head>

<body>
  <!-- ================= HEADER ================= -->
  <header data-aos="fade-down">
    <h1><img src="../logo.png" alt="logo" data-aos="zoom-in-down">Video Gallery 🎥</h1>
    <p data-aos="fade-up"><b>"Empowering every girl with the strength to be safe, the courage to rise, and the hope for a brighter tomorrow."</b></p>
  </header>

  <!-- ================= VIDEO GALLERY ================= -->

      <!-- Video Card 2 -->
      <button class="video-card tilt reveal" type="button"

        </figure>

      </button>

      <!-- Video Card 3 -->
      <button class="video-card tilt reveal" type="button"

      <!-- Video Card 4 -->
      <button class="video-card tilt reveal" type="button"
        data-src="v4.mp4"

      </button>
      <!-- Card 5 -->
<button class="video-card tilt reveal" type="button"
  data-src="v5.mp4"

  <figure class="video-figure">

<button class="video-card tilt reveal" type="button"

  <figure class="video-figure">

  </figure>
  <figcaption class="video-caption" data-meta="Bootcamp | 4:10">Leadership Bootcamp</figcaption>

<!-- Card 7 -->
<button class="video-card tilt reveal" type="button"
  data-src="v7.mp4"

<button class="video-card tilt reveal" type="button"

  <figure class="video-figure">

<!-- extra one -->
<button class="video-card tilt reveal add-card" type="button">
    <figure class="video-figure">
      <div class="upload-icon">＋</div>
      <figcaption class="video-caption" data-meta="Coming Soon">Add New Video</figcaption>
    </figure>
  </button>
    </div>
    <!-- Lightbox -->
    <div class="lightbox" role="dialog" aria-modal="true" hidden>
      <div class="lightbox-backdrop" data-close></div>
      <div class="lightbox-dialog">
        <button class="lightbox-close" type="button" aria-label="Close video" data-close>&times;</button>
        <h3 class="lightbox-title">Title</h3>
        <div class="lightbox-player">
          <video class="lightbox-video" controls playsinline preload="metadata"></video>
        </div>
        <p class="lightbox-caption">Caption</p>
        <div class="lightbox-controls">
          <button type="button" class="nav-btn prev">&larr; Prev</button>
          <button type="button" class="nav-btn next">Next &rarr;</button>
        </div>
      </div>
    </div>
  </section>
  <footer>
  © <span id="year"></span> Her Voice, Her Power — All Rights Reserved.
</footer>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration:1000, once:true });

    // Lightbox Script
    (function () {
      const cards = [...document.querySelectorAll('.video-card')];
      const lightbox = document.querySelector('.lightbox');
      const videoEl = lightbox.querySelector('.lightbox-video');
      const titleEl = lightbox.querySelector('.lightbox-title');
      const captionEl = lightbox.querySelector('.lightbox-caption');
      const closeEls = lightbox.querySelectorAll('[data-close]');
      const prevBtn = lightbox.querySelector('.prev');
      const nextBtn = lightbox.querySelector('.next');
      let currentIndex = 0;

      const items = cards.map(card => ({
        src: card.dataset.src,
        title: card.dataset.title,
        caption: card.dataset.caption
      }));

      function openLightbox(i) {
        currentIndex = i;
        updateLightbox();
        lightbox.hidden = false;
        document.documentElement.style.overflow = 'hidden';
        videoEl.play().catch(() => {});
      }

      function closeLightbox() {
        videoEl.pause();
        lightbox.hidden = true;
        document.documentElement.style.overflow = '';
      }

      function updateLightbox() {
        const item = items[currentIndex];
        videoEl.src = item.src;
        titleEl.textContent = item.title;
        captionEl.textContent = item.caption;
      }

      function showPrev() { currentIndex = (currentIndex - 1 + items.length) % items.length; updateLightbox(); videoEl.play(); }
      function showNext() { currentIndex = (currentIndex + 1) % items.length; updateLightbox(); videoEl.play(); }

      cards.forEach((card, i) => card.addEventListener('click', () => openLightbox(i)));
      closeEls.forEach(el => el.addEventListener('click', closeLightbox));
      prevBtn.addEventListener('click', showPrev);
      nextBtn.addEventListener('click', showNext);
      lightbox.querySelector('.lightbox-backdrop').addEventListener('click', closeLightbox);
    })();
  </script>
</body>
</html>
