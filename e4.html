<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emergency Contact | NGO for Girls Welfare & Safety</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet" />
  <style>
    /* ---------- Colors & Root Variables ---------- */
    :root {
      --faint-blue: #e6f0fa;
      --primary-blue: #4B8CEB;
      --white: #fff;
      --text-base: #222a35;
      --accent: #50bddc;
      --card-hover: #f1f7fd;
    }

    /* ---------- Body & Container ---------- */
    body {
      margin: 0;
      font-family: 'Roboto', Arial, sans-serif;
      background: var(--faint-blue);
      color: var(--text-base);
      min-height: 100vh;
    }
    .container {
      max-width: 400px;
      margin: 40px auto;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(60, 120, 180, 0.16);
      padding: 32px 24px;
      animation: fadeInUp 0.8s cubic-bezier(.68,-0.55,.27,1.55);
    }

    /* ---------- Animations ---------- */
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(40px);}
      100% { opacity: 1; transform: translateY(0);}
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    @keyframes bounceIn {0%{transform: scale(0.8);}100%{transform:scale(1);}}

    /* ---------- Header ---------- */
    .header {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    .header img {
      height: 100px;
      width: 100px;
    }
    .title-block h1 {
      font-size: 1.25em;
      margin: 0;
      color: var(--primary-blue);
      font-weight: 700;
    }
    .title-block small {
      color: var(--accent);
      font-size: 0.92em;
    }

    /* ---------- Address Bar ---------- */
    .address-bar {
      margin: 28px 0 18px 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .address-bar input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 9px;
      border: 1.5px solid var(--primary-blue);
      background: #f5f9ff;
      outline: none;
    }
    .address-bar input:focus { box-shadow: 0 2px 8px #E6F0FA; }

    /* ---------- Tabs ---------- */
    .tabs {
      display: flex;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      border-radius: 9px 9px 0 0;
      border: none;
      font-weight: bold;
      color: var(--primary-blue);
      background: var(--faint-blue);
      cursor: pointer;
      transition: background 0.2s;
      margin-right: 3px;
    }
    .tab.active { background: var(--primary-blue); color: var(--white); }

    /* ---------- Lists ---------- */
    .helpline-list, .emergency-list {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      animation: fadeIn 0.4s;
    }
    .helpline-list.active, .emergency-list.active { display: grid; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-height: 110px;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, background 0.22s;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.03);
      background: var(--card-hover);
      box-shadow: 0 6px 18px rgba(76,142,224,0.12);
    }
    .card-icon { font-size: 2em; margin-bottom: 5px; }
    .card-label { font-weight: bold; font-size: 1.05em; }
    .card-small { font-size: 0.89em; color: #79a3cd; }
    .call-btn {
      position: absolute;
      top: 9px; right: 9px;
      width: 29px; height: 29px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.18em;
      cursor: pointer;
    }
    .call-btn:active { background: var(--primary-blue); }

    /* ---------- Emergency Cards ---------- */
    .emergency-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #e0ecff 0%, #ffffff 100%);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 15px;
      animation: bounceIn 0.6s;
    }
    .emergency-icon { font-size: 1.5em; color: var(--primary-blue); margin-right: 10px; }
    .emergency-number { font-weight: bold; color: var(--accent); font-size: 1.22em; }
    .emergency-label { font-weight: 600; font-size: 1.07em; }

    /* ---------- Responsive ---------- */
    @media (max-width: 480px) {
      .container { padding: 12px 4px; }
      .header { flex-direction: column; align-items: flex-start;}
      .helpline-list, .emergency-list { grid-template-columns: 1fr; gap: 15px;}
    }
    
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div><img src="logo.png" alt="logo"></div>
    <div class="title-block">
      <h1>Girls Welfare & Safety</h1>
      <small>Emergency & Nearest Helplines</small>
    </div>
  </div>

  <!-- Address Input -->
  <div class="address-bar">
    <span>🏠</span>
    <input id="addressInput" placeholder="Enter your area or address">
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-helplines">Nearby Helplines</button>
    <button class="tab" id="tab-emergency">Emergency Numbers</button>
  </div>

  <!-- Lists -->
  <div id="helplineSection" class="helpline-list active"></div>
  <div id="emergencySection" class="emergency-list"></div>

</div>
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close report form" onclick="closeModal()">×</button>
      <h3 id="modalTitle">Report an Incident</h3>
      <form id="reportForm" onsubmit="return submitReport(event)">
        <input type="text" aria-label="Your Name" id="reportName" class="modal-input" placeholder="Your name (optional)" />
        <input
          type="text"
          aria-label="Area or Address"
          id="reportArea"
          class="modal-input"
          placeholder="Area or Address"
          required
        />
        <textarea
          id="reportMsg"
          aria-label="Describe the incident"
          placeholder="Describe the incident..."
          class="modal-textarea"
          rows="5"
          required
        ></textarea>
        <button type="submit" class="modal-btn-submit">Send Report</button>
      </form>
      <div id="reportStatus" role="status" aria-live="polite"></div>
    </div>
  </div>

<script>
  // ---------- Helpline Data ----------
  const helplinesByArea = {
    default: [
      { label:"Police Station", icon:'👮', contact:"100", desc:"SE16 Police Station" },
      { label:"Charity Home", icon:'💖', contact:"040-22113344", desc:"Teresa Charity Home" },
      { label:"Grocery", icon:'🏪', contact:"040-33445531", desc:"Nehru Grocery Store" },
      { label:"Public Hospital", icon:'🏥', contact:"040-55332211", desc:"SRM Public Hospital" },
      { label:"NGO Centre", icon:'🏠', contact:"040-99887766", desc:"Garuda NGO Centre" },
      { label:"Super Store", icon:'🏬', contact:"040-22446613", desc:"SMS Super Store" }
    ],
    hyderabad: [
      { label:"Police Station", icon:'👮', contact:"100", desc:"Lal Bagh Police" },
      { label:"Women NGO", icon:'👩‍🦰', contact:"040-12345678", desc:"Hyderabad Women Centre" },
      { label:"Safe Home", icon:'🏡', contact:"040-98765432", desc:"Sai Safe Home" },
      { label:"City Hospital", icon:'🏥', contact:"040-87654321", desc:"Hyderabad City Hospital" },
      { label:"Support Desk", icon:'🛡️', contact:"040-33445566", desc:"Girls Helpdesk" }
    ]
  };

  // ---------- Emergency Numbers ----------
  const emergencyContacts = [
    { icon:'👮‍♂️', number:"112", label:"Local Police" },
    { icon:'👩‍🦰', number:"181", label:"Women Helpline" },
    { icon:'🚑', number:"108", label:"Local Ambulance" },
    { icon:'🚒', number:"101", label:"Fire & Rescue" }
  ];

  // ---------- Elements ----------
  const helplineSection = document.getElementById('helplineSection');
  const emergencySection = document.getElementById('emergencySection');
  const tabHelplines = document.getElementById('tab-helplines');
  const tabEmergency = document.getElementById('tab-emergency');
  const addressInput = document.getElementById('addressInput');

  // ---------- Functions ----------
  function renderHelplines(area='default'){
    let list = helplinesByArea[area] || helplinesByArea['default'];
    helplineSection.innerHTML = '';
    list.forEach((hl, i)=>{
      helplineSection.innerHTML += `
      <div class="card" style="animation-delay:${i*0.06}s">
        <div class="card-icon">${hl.icon}</div>
        <div class="card-label">${hl.label}</div>
        <div class="card-small">${hl.desc}</div>
        <button class="call-btn" onclick="window.open('tel:${hl.contact}')">📞</button>
      </div>`;
    });
  }

  function renderEmergencies(){
    emergencySection.innerHTML = '';
    emergencyContacts.forEach((e, i)=>{
      emergencySection.innerHTML += `
      <div class="emergency-card" style="animation-delay:${i*0.08}s">
        <span class="emergency-icon">${e.icon}</span>
        <div class="emergency-info">
          <div class="emergency-number">${e.number}</div>
          <div class="emergency-label">${e.label}</div>
        </div>
        <button class="call-btn" onclick="window.open('tel:${e.number}')">📞</button>
      </div>`;
    });
  }

  // ---------- Tab Switching ----------
  tabHelplines.onclick = () => {
    tabHelplines.classList.add('active');
    tabEmergency.classList.remove('active');
    helplineSection.classList.add('active');
    emergencySection.classList.remove('active');
  }
  tabEmergency.onclick = () => {
    tabHelplines.classList.remove('active');
    tabEmergency.classList.add('active');
    helplineSection.classList.remove('active');
    emergencySection.classList.add('active');
  }

  // ---------- Area Input ----------
  addressInput.addEventListener('input', ()=>{
    let val = addressInput.value.trim().toLowerCase();
    if(val.includes('hyderabad')) renderHelplines('hyderabad');
    else renderHelplines('default');
  });

  // ---------- Initial Render ----------
  renderHelplines();
  renderEmergencies();

</script>
</body>
</html>

      background: var(--faint-blue);
      cursor: pointer;
      transition: background 0.2s;
      margin-right: 3px;
    }
    .tab.active { background: var(--primary-blue); color: var(--white); }

    /* ---------- Lists ---------- */
    .helpline-list, .emergency-list {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      animation: fadeIn 0.4s;
    }
    .helpline-list.active, .emergency-list.active { display: grid; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-height: 110px;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, background 0.22s;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.03);
      background: var(--card-hover);
      box-shadow: 0 6px 18px rgba(76,142,224,0.12);
    }
    .card-icon { font-size: 2em; margin-bottom: 5px; }
    .card-label { font-weight: bold; font-size: 1.05em; }
    .card-small { font-size: 0.89em; color: #79a3cd; }
    .call-btn {
      position: absolute;
      top: 9px; right: 9px;
      width: 29px; height: 29px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.18em;
      cursor: pointer;
    }
    .call-btn:active { background: var(--primary-blue); }

    /* ---------- Emergency Cards ---------- */
    .emergency-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #e0ecff 0%, #ffffff 100%);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 15px;
      animation: bounceIn 0.6s;
    }
    .emergency-icon { font-size: 1.5em; color: var(--primary-blue); margin-right: 10px; }
    .emergency-number { font-weight: bold; color: var(--accent); font-size: 1.22em; }
    .emergency-label { font-weight: 600; font-size: 1.07em; }

    /* ---------- Responsive ---------- */
    @media (max-width: 480px) {
      .container { padding: 12px 4px; }
      .header { flex-direction: column; align-items: flex-start;}
      .helpline-list, .emergency-list { grid-template-columns: 1fr; gap: 15px;}
    }
    
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div><img src="logo.png" alt="logo"></div>
    <div class="title-block">
      <h1>Girls Welfare & Safety</h1>
      <small>Emergency & Nearest Helplines</small>
    </div>
  </div>

  <!-- Address Input -->
  <div class="address-bar">
    <span>🏠</span>
    <input id="addressInput" placeholder="Enter your area or address">
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-helplines">Nearby Helplines</button>
    <button class="tab" id="tab-emergency">Emergency Numbers</button>
  </div>

  <!-- Lists -->
  <div id="helplineSection" class="helpline-list active"></div>
  <div id="emergencySection" class="emergency-list"></div>

</div>
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close report form" onclick="closeModal()">×</button>
      <h3 id="modalTitle">Report an Incident</h3>
      <form id="reportForm" onsubmit="return submitReport(event)">
        <input type="text" aria-label="Your Name" id="reportName" class="modal-input" placeholder="Your name (optional)" />
        <input
          type="text"
          aria-label="Area or Address"
          id="reportArea"
          class="modal-input"
          placeholder="Area or Address"
          required
        />
        <textarea
          id="reportMsg"
          aria-label="Describe the incident"
          placeholder="Describe the incident..."
          class="modal-textarea"
          rows="5"
          required
        ></textarea>
        <button type="submit" class="modal-btn-submit">Send Report</button>
      </form>
      <div id="reportStatus" role="status" aria-live="polite"></div>
    </div>
  </div>

<script>
  // ---------- Helpline Data ----------
  const helplinesByArea = {
    default: [
      { label:"Police Station", icon:'👮', contact:"100", desc:"SE16 Police Station" },
      { label:"Charity Home", icon:'💖', contact:"040-22113344", desc:"Teresa Charity Home" },
      { label:"Grocery", icon:'🏪', contact:"040-33445531", desc:"Nehru Grocery Store" },
      { label:"Public Hospital", icon:'🏥', contact:"040-55332211", desc:"SRM Public Hospital" },
      { label:"NGO Centre", icon:'🏠', contact:"040-99887766", desc:"Garuda NGO Centre" },
      { label:"Super Store", icon:'🏬', contact:"040-22446613", desc:"SMS Super Store" }
    ],
    hyderabad: [
      { label:"Police Station", icon:'👮', contact:"100", desc:"Lal Bagh Police" },
      { label:"Women NGO", icon:'👩‍🦰', contact:"040-12345678", desc:"Hyderabad Women Centre" },
      { label:"Safe Home", icon:'🏡', contact:"040-98765432", desc:"Sai Safe Home" },
      { label:"City Hospital", icon:'🏥', contact:"040-87654321", desc:"Hyderabad City Hospital" },
      { label:"Support Desk", icon:'🛡️', contact:"040-33445566", desc:"Girls Helpdesk" }
    ]
  };

  // ---------- Emergency Numbers ----------
  const emergencyContacts = [
    { icon:'👮‍♂️', number:"112", label:"Local Police" },
    { icon:'👩‍🦰', number:"181", label:"Women Helpline" },
    { icon:'🚑', number:"108", label:"Local Ambulance" },
    { icon:'🚒', number:"101", label:"Fire & Rescue" }
  ];

  // ---------- Elements ----------
  const helplineSection = document.getElementById('helplineSection');
  const emergencySection = document.getElementById('emergencySection');
  const tabHelplines = document.getElementById('tab-helplines');
  const tabEmergency = document.getElementById('tab-emergency');
  const addressInput = document.getElementById('addressInput');

  // ---------- Functions ----------
  function renderHelplines(area='default'){
    let list = helplinesByArea[area] || helplinesByArea['default'];
    helplineSection.innerHTML = '';
    list.forEach((hl, i)=>{
      helplineSection.innerHTML += `
      <div class="card" style="animation-delay:${i*0.06}s">
        <div class="card-icon">${hl.icon}</div>
        <div class="card-label">${hl.label}</div>
        <div class="card-small">${hl.desc}</div>
        <button class="call-btn" onclick="window.open('tel:${hl.contact}')">📞</button>
      </div>`;
    });
  }

  function renderEmergencies(){
    emergencySection.innerHTML = '';
    emergencyContacts.forEach((e, i)=>{
      emergencySection.innerHTML += `
      <div class="emergency-card" style="animation-delay:${i*0.08}s">
        <span class="emergency-icon">${e.icon}</span>
        <div class="emergency-info">
          <div class="emergency-number">${e.number}</div>
          <div class="emergency-label">${e.label}</div>
        </div>
        <button class="call-btn" onclick="window.open('tel:${e.number}')">📞</button>
      </div>`;
    });
  }

  // ---------- Tab Switching ----------
  tabHelplines.onclick = () => {
    tabHelplines.classList.add('active');
    tabEmergency.classList.remove('active');
    helplineSection.classList.add('active');
    emergencySection.classList.remove('active');
  }
  tabEmergency.onclick = () => {
    tabHelplines.classList.remove('active');
    tabEmergency.classList.add('active');
    helplineSection.classList.remove('active');
    emergencySection.classList.add('active');
  }

  // ---------- Area Input ----------
  addressInput.addEventListener('input', ()=>{
    let val = addressInput.value.trim().toLowerCase();
    if(val.includes('hyderabad')) renderHelplines('hyderabad');
    else renderHelplines('default');
  });

  // ---------- Initial Render ----------
  renderHelplines();
  renderEmergencies();

</script>
</body>
</html>
